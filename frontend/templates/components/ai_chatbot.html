<!-- Nút bong bóng chat AI hỗ trợ -->
<button id="chat-button" class="chat-button" title="Trợ lý AI hỗ trợ 24/7" aria-label="Mở chat AI">
    <img src="{{ url_for('static', filename='chatbot_fitted_logo.png') }}" alt="AI Logo">
</button>

<!-- Cửa sổ Chat AI -->
<div id="chat-window" class="chat-window">
    <div id="chat-header" class="chat-header" style="background: linear-gradient(135deg, #091227 0%, #1e3a8a 100%);">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="{{ url_for('static', filename='chatbot_logo.png') }}" alt="AI Logo" style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #00d2ff; object-fit: cover;">
            <div>
                <div style="font-weight: 700; font-size: 15px; color: #fff; line-height: 1.2;">CHATBOT AI CSKH</div>
                <div style="font-size: 11px; color: #38bdf8; display: flex; align-items: center; gap: 4px;">
                    <span style="display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e;"></span>
                    Trực tuyến 24/7
                </div>
            </div>
        </div>
        <span id="chat-close" style="cursor: pointer; font-size: 22px; line-height: 1; opacity: 0.85; color: white;">&times;</span>
    </div>
    <div id="chat-messages" class="chat-messages">
        <div class="chat-message bot">
            <div class="message-content">Xin chào! Tôi là trợ lý AI thông minh. Bạn có thể hỏi tôi bất kỳ điều gì về điện thoại, bảo hành, chính sách mua hàng hoặc hỗ trợ kỹ thuật!</div>
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
        <button id="chat-send" title="Gửi tin nhắn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

{% extends "base.html" %}

{% block title %}Tạo Báo Giá Mới - CRM Care AI{% endblock %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto;">
    <div class="page-header">
        <h1 class="page-title">LẬP BÁO GIÁ ĐIỆN THOẠI MỚI</h1>
        <a href="/quotations" class="btn btn-secondary">Quay lại danh sách</a>
    </div>

    <form method="POST" action="/quotations/create" class="form-box">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Khách hàng nhận báo giá:</label>
                <select name="customer_id" class="form-control" id="cust-select" onchange="fillCustInfo(this)">
                    {% for c in customers %}
                    <option value="{{ c.id }}" data-phone="{{ c.phone }}" data-name="{{ c.full_name }}" {% if sel_cust_id == c.id %}selected{% endif %}>
                        {{ c.full_name }} ({{ c.phone or 'Chưa có SĐT' }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Số điện thoại liên hệ:</label>
                <input type="tel" name="customer_phone" id="cust-phone" class="form-control" value="{{ sel_cust.phone if sel_cust else '' }}" required placeholder="0901234567">
            </div>
        </div>

        <div class="form-group">
            <label>Mẫu điện thoại báo giá:</label>
            <select name="product_id" class="form-control" required id="prod-select" onchange="updatePricePreview(this)">
                {% for p in products %}
                <option value="{{ p.id }}" data-price="{{ p.promo_price or p.listed_price }}" data-listed="{{ p.listed_price }}" data-stock="{{ p.stock_quantity }}" {% if sel_prod_id == p.id %}selected{% endif %}>
                    {{ p.name }} ({{ p.brand }}) - Giá: {{ "{:,.0f}".format(p.promo_price or p.listed_price) }} ₫ (Tồn: {{ p.stock_quantity }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Số lượng:</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" max="10" required>
            </div>

            <div class="form-group">
                <label>Mã chương trình khuyến mãi:</label>
                <select name="promotion_code" class="form-control">
                    <option value="">-- Không áp dụng mã --</option>
                    {% for pr in promotions %}
                    <option value="{{ pr.promo_code }}">
                        {{ pr.promo_code }}: {{ pr.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Ghi chú tư vấn & Ưu đãi kèm theo:</label>
            <textarea name="notes" rows="3" class="form-control" placeholder="Tặng kèm dán màn hình cường lực, ốp lưng chính hãng và hỗ trợ chuyển dữ liệu miễn phí..."></textarea>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-save" style="padding: 11px 24px;">
                Tạo Báo Giá & Gửi Cho Khách
            </button>
            <a href="/quotations" class="btn btn-back">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function fillCustInfo(sel) {
        const opt = sel.options[sel.selectedIndex];
        const phone = opt.getAttribute("data-phone");
        if (phone) {
            document.getElementById("cust-phone").value = phone;
        }
    }
</script>
{% endblock %}

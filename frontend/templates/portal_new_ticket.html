{% extends "base.html" %}

{% block title %}Gửi Phiếu Hỗ Trợ Mới - Cổng Khách Hàng{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
    <div class="page-header">
        <h1 class="page-title">GỬI YÊU CẦU HỖ TRỢ MỚI</h1>
        <a href="/portal" class="btn btn-secondary">Quay lại Cổng hỗ trợ</a>
    </div>

    <form method="POST" action="/portal/new-ticket" class="form-box">
        <div class="form-group">
            <label>Tiêu đề sự cố / Yêu cầu cần hỗ trợ:</label>
            <input type="text" name="subject" class="form-control" required placeholder="VD: Màn hình iPhone 15 bị sọc xanh sau khi rơi..." autofocus>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Số điện thoại liên hệ:</label>
                <input type="tel" name="customer_phone" class="form-control" value="{{ user.phone if user else '' }}" required placeholder="0901234567">
            </div>

            <div class="form-group">
                <label>Độ ưu tiên:</label>
                <select name="priority" class="form-control">
                    <option value="low">Thấp (Tư vấn chung)</option>
                    <option value="medium" selected>Trung bình (Cần giải đáp sớm)</option>
                    <option value="high">Cao (Lỗi máy không dùng được)</option>
                    <option value="urgent">Khẩn cấp (Cháy nổ / rủi ro an toàn)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Mô tả chi tiết vấn đề bạn đang gặp phải:</label>
            <textarea name="message" rows="5" class="form-control" required placeholder="Vui lòng mô tả chi tiết biểu hiện của máy, thời gian xảy ra lỗi hoặc các bước bạn đã thử..."></textarea>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Gửi Yêu Cầu Cho Kỹ Thuật Viên</button>
            <a href="/portal" class="btn btn-back">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}

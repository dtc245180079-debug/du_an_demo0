{% extends "base.html" %}

{% block title %}Thêm dữ liệu hỗ trợ mới - FAQs{% endblock %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <div class="page-header">
        <h1 class="page-title">THÊM KỊCH BẢN HỖ TRỢ MỚI</h1>
        <a href="/faqs" class="btn btn-secondary">Quay lại danh sách</a>
    </div>

    <form method="POST" class="form-box">
        <div class="form-group">
            <label>Tên sự cố / Tên chính sách:</label>
            <input type="text" name="issue_name" required placeholder="VD: Lỗi sọc màn hình, Trả góp Sacombank...">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label>Danh mục:</label>
                <select name="category">
                    <option value="Kỹ thuật">Kỹ thuật</option>
                    <option value="Bảo hành">Bảo hành</option>
                    <option value="Trả góp">Trả góp</option>
                    <option value="Đơn hàng">Đơn hàng</option>
                    <option value="Chính sách">Chính sách chung</option>
                </select>
            </div>

            <div class="form-group">
                <label>Thương hiệu:</label>
                <input type="text" name="brand" required placeholder="VD: Apple, Samsung, Tất cả...">
            </div>
        </div>

        <div class="form-group">
            <label>Biểu hiện của máy / Câu hỏi thường gặp của khách:</label>
            <textarea name="symptom" rows="3" required placeholder="Mô tả các biểu hiện cụ thể hoặc câu hỏi khách thường đặt ra..."></textarea>
        </div>

        <div class="form-group">
            <label>Cách xử lý / Câu trả lời chuẩn của CSKH:</label>
            <textarea name="solution" rows="4" required placeholder="Hướng dẫn từng bước khắc phục hoặc chính sách áp dụng cụ thể..."></textarea>
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-save">Lưu dữ liệu</button>
            <a href="/faqs" class="btn btn-back">Hủy bỏ</a>
        </div>
    </form>
</div>
{% endblock %}
